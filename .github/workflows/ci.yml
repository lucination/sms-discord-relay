name: CI and release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and smoke-test container
        run: |
          docker build -f Containerfile -t sms-discord-relay:test .
          docker run -d --name relay-test -p 127.0.0.1:8080:8080 \
            -e SMS_GATEWAY_SIGNING_KEY=ci-test-key sms-discord-relay:test
          trap 'docker rm -f relay-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          docker exec relay-test /sms-discord-relay --healthcheck
          for attempt in $(seq 1 40); do
            health=$(docker inspect --format '{{.State.Health.Status}}' relay-test)
            if [ "$health" = healthy ]; then break; fi
            sleep 1
          done
          test "$health" = healthy
          # A probe against an unused port must fail, not report healthy.
          if docker exec -e BIND_ADDR=127.0.0.1:1 relay-test /sms-discord-relay --healthcheck; then
            printf 'Healthcheck falsely succeeded on an unused port\n'; exit 1
          fi
          python3 - <<'PY'
          import hashlib, hmac, json, time, urllib.request
          body = json.dumps({"event": "sms:received", "deviceId": "device", "id": "delivery", "webhookId": "hook", "scheme": "https", "payload": {"messageId": "ci", "sender": "ci-sender", "phoneNumber": "legacy", "recipient": None, "simNumber": 1, "message": "Container smoke test @everyone", "receivedAt": "2026-01-01T00:00:00Z"}}).encode()
          timestamp = str(int(time.time()))
          signature = hmac.new(b"ci-test-key", body + timestamp.encode(), hashlib.sha256).hexdigest()
          request = urllib.request.Request("http://127.0.0.1:8080/transform", data=body, headers={"Content-Type": "application/json", "X-Timestamp": timestamp, "X-Signature": signature})
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          assert payload["allowed_mentions"]["parse"] == []
          assert payload["content"] == "📱 **New SMS from ci-sender**\nContainer smoke test @everyone\n-# 2026-01-01T00:00:00Z"
          PY

  release-build:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native image and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf 'Expected stable semver tag vX.Y.Z\n'; exit 1; }
          IMAGE="ghcr.io/${REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          mkdir -p dist
          docker buildx build -f Containerfile --platform "linux/$ARCH" --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false" \
            --metadata-file image-metadata.json .
          digest=$(jq -er '.["containerimage.digest"]' image-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > "dist/image-digest-$ARCH.txt"
          # Docker media types preserve healthcheck behavior in Docker AND Podman.
          docker buildx imagetools inspect --raw "$IMAGE@$digest" | \
            jq -e '.mediaType == "application/vnd.docker.distribution.manifest.v2+json"'
          docker pull "$IMAGE@$digest"
          docker image inspect "$IMAGE@$digest" | \
            jq -e '.[0].Config.Healthcheck.Test == ["CMD", "/sms-discord-relay", "--healthcheck"]'
          probe_container=$(docker run -d --health-interval=1s --health-start-period=1s \
            -e SMS_GATEWAY_SIGNING_KEY=ci-test-key "$IMAGE@$digest")
          trap 'docker rm -f "$probe_container" >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$probe_container")
            if [ "$health" = healthy ]; then break; fi
            sleep 1
          done
          test "$health" = healthy
          docker rm -f "$probe_container"
          trap - EXIT
          # The archive uses the shared tag locally; no per-architecture tag is pushed.
          docker tag "$IMAGE@$digest" "$IMAGE:$RELEASE_TAG"
          # Modern Docker save can emit OCI archives; explicitly export Docker tar format.
          docker buildx build -f Containerfile --platform "linux/$ARCH" --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            -t "$IMAGE:$RELEASE_TAG" \
            --output "type=docker,dest=dist/sms-discord-relay-linux-$ARCH-container.tar" .
          gzip -9 "dist/sms-discord-relay-linux-$ARCH-container.tar"
          container=$(docker create "$IMAGE:$RELEASE_TAG")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/sms-discord-relay" "dist/sms-discord-relay-linux-$ARCH"
          chmod +x "dist/sms-discord-relay-linux-$ARCH"
          file "dist/sms-discord-relay-linux-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish multi-architecture manifest and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          digest_amd64=$(<dist/image-digest-amd64.txt)
          digest_arm64=$(<dist/image-digest-arm64.txt)
          [[ "$digest_amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$digest_arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          major_tag=${RELEASE_TAG%%.*}
          minor_tag=${RELEASE_TAG%.*}
          docker buildx imagetools create \
            -t "$IMAGE:$RELEASE_TAG" -t "$IMAGE:$minor_tag" -t "$IMAGE:$major_tag" -t "$IMAGE:latest" \
            "$IMAGE@$digest_amd64" "$IMAGE@$digest_arm64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"
          (cd dist && sha256sum sms-discord-relay-linux-amd64 sms-discord-relay-linux-arm64 *-container.tar.gz > SHA256SUMS)
          printf 'Container: `%s:%s` (Linux amd64 and arm64).\n\nContainer archives load with `docker load` or `podman load`. Binaries are static musl; mark downloaded binaries executable with `chmod +x`. Runtime secrets are supplied separately.\n' "$IMAGE" "$RELEASE_TAG" > dist/release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/sms-discord-relay-linux-amd64 dist/sms-discord-relay-linux-arm64 dist/*-container.tar.gz dist/SHA256SUMS --repo "$REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/sms-discord-relay-linux-amd64 dist/sms-discord-relay-linux-arm64 dist/*-container.tar.gz dist/SHA256SUMS \
              --repo "$REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file dist/release-notes.md
          fi
