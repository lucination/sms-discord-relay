[package]
name = "sms-discord-relay"
version = "0.1.4"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
webpki-root-certs = "1.0.12"

tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-log = { version = "0.2.0", default-features = false, features = ["std", "log-tracer"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "registry", "env-filter"] }

[dev-dependencies]
log = "0.4.35"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
